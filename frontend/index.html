<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>LocalPulse - Report a concern</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <header>
    <div class="header-top">
      <h1 data-i18n="title">LocalPulse</h1>
      <select id="language">
        <option value="en">English</option>
        <option value="fi">Suomi</option>
        <option value="sv">Svenska</option>
      </select>
    </div>
    <p data-i18n="subtitle">Report a concern or idea in your neighbourhood</p>
  </header>

  <main>
    <div id="map"></div>

    <form id="report-form">
      <label for="note" data-i18n="noteLabel">What's going on?</label>
      <div class="note-row">
        <textarea id="note" data-i18n-placeholder="notePlaceholder" placeholder="e.g. Broken streetlight on Otaniementie"></textarea>
        <button type="button" id="voice-btn" data-i18n="voiceBtn">🎤 Voice</button>
      </div>

      <label for="photo" data-i18n="photoLabel">Add a photo (optional)</label>
      <input type="file" id="photo" accept="image/*" />

      <button type="submit" data-i18n="submitBtn">Submit report</button>
    </form>

    <div id="status"></div>
  </main>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
